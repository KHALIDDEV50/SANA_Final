spring.application.name=SANA
# Local values are the defaults; on the server DB_URL, DB_USERNAME and DB_PASSWORD come from the environment
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/SANA}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
# No fixed dialect: Hibernate detects MySQL or MariaDB from the connection,
# so the same file works on MySQL 8.4 (AWS RDS) and on XAMPP MariaDB. Do not force a dialect here.

# Use the dialect matching the local MariaDB server.
#spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect




spring.jpa.show-sql=false
spring.jpa.generate-ddl=true
#spring.jpa.hibernate.ddl-auto=Update
spring.jpa.hibernate.ddl-auto=update

server.web.error.include-message=never
server.web.error.include-stacktrace=never


# AI execution is owned by n8n. Keep both secrets in the environment.
# Setting N8N_AI_WEBHOOK_URL turns the AI on (and then both keys are required);
# without it the backend still starts and only the AI requests return 503.
sana.n8n.business-enabled=true
sana.n8n.webhook-url=${N8N_AI_WEBHOOK_URL:}
sana.n8n.request-key=${N8N_AI_WEBHOOK_KEY:}
sana.n8n.callback-key=${N8N_AI_CALLBACK_KEY:}

# Moodboard images. Pixabay is used only when PIXABAY_API_KEY is set; the other image sources need no key.
# Downloaded Pixabay images are kept in SANA_IMAGES_DIR (a Docker volume on the server, so deploys keep them).
sana.images.pixabay.api-key=${PIXABAY_API_KEY:}
sana.images.storage-dir=${SANA_IMAGES_DIR:./sana-moodboard-images}

# Billing (Moyasar TEST mode). Off unless SANA_BILLING_ENABLED=true; the secret key stays in the server's .env only.
sana.billing.enabled=${SANA_BILLING_ENABLED:false}
sana.billing.test-mode=${SANA_BILLING_TEST_MODE:true}
sana.billing.secret-key=${MOYASAR_SECRET_KEY:}
sana.billing.public-base-url=${SANA_PUBLIC_BASE_URL:}
sana.billing.frontend-base-url=${SANA_FRONTEND_BASE_URL:}

# Send registration notifications through a separate n8n workflow.
sana.notifications.enabled=${SANA_NOTIFICATIONS_ENABLED:false}
sana.notifications.webhook-url=${N8N_NOTIFICATIONS_WEBHOOK_URL:}
sana.notifications.request-key=${N8N_NOTIFICATIONS_KEY:}