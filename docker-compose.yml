# Runs SANA on the server: the app, plus Caddy in front of it for HTTPS.
# Caddy gets and renews the HTTPS certificate for DOMAIN automatically.
# Secrets are read from the .env file next to this file (never committed).
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      SANA_IMAGES_DIR: /data/moodboard-images
    # Downloaded moodboard images live in a volume, so rebuilding the app on deploy keeps them
    volumes:
      - moodboard_images:/data/moodboard-images

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
  moodboard_images:
